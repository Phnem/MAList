query MediaById($id: Int) {
  Media(id: $id, type: ANIME) {
    id
    title {
      romaji
      english
    }
    description
    type
    format
    source
    status
    episodes
    season
    seasonYear
    startDate {
      year
      month
      day
    }
    studios(isMain: true) {
      nodes {
        name
      }
    }
    coverImage {
      large
    }
    averageScore
    genres
  }
}
