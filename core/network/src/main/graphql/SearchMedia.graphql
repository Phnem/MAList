query SearchMedia($q: String) {
  Media(search: $q, type: ANIME) {
    title {
      romaji
      english
    }
    description
    coverImage {
      extraLarge
      large
    }
    type
    status
    episodes
    nextAiringEpisode {
      episode
      airingAt
    }
    averageScore
    genres
    startDate {
      year
      month
      day
    }
  }
}
